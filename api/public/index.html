<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RP-Cloud Labs | Request a tool session</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 30rem);
        box-sizing: border-box;
        padding: 2rem;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 2.5rem #17203318;
      }

      h1 { margin-top: 0; }
      p { line-height: 1.5; }

      label {
        display: block;
        margin: 1rem 0 0.4rem;
        font-weight: 600;
      }

      input, select, button {
        width: 100%;
        box-sizing: border-box;
        min-height: 2.8rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid #aeb8c8;
        border-radius: 0.5rem;
        font: inherit;
      }

      button {
        margin-top: 1.25rem;
        border: 0;
        color: #fff;
        background: #175cd3;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled { opacity: 0.65; cursor: wait; }
      #result { margin-bottom: 0; }
      #result[data-state="error"] { color: #b42318; }
      #result[data-state="success"] { color: #067647; }
    </style>
  </head>
  <body>
    <main>
      <h1>Request a tool session</h1>
      <p>Enter your student ID and select the tool you need for your lab session.</p>
      <form id="session-form">
        <label for="studentId">Student ID</label>
        <input id="studentId" name="studentId" autocomplete="off" required maxlength="100">

        <label for="tool">Tool</label>
        <select id="tool" name="tool" required>
          <option value="">Choose a tool</option>
          <option value="Programming environment">Programming environment</option>
          <option value="Database tool">Database tool</option>
        </select>

        <button type="submit">Request session</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector('#session-form');
      const result = document.querySelector('#result');
      const button = form.querySelector('button');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = '';
        result.removeAttribute('data-state');
        button.disabled = true;

        try {
          const response = await fetch('/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              studentId: form.elements.studentId.value,
              tool: form.elements.tool.value
            })
          });
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error || 'Unable to submit the session request');
          }

          result.dataset.state = 'success';
          result.textContent = `Request received. Session ${body.session.id} is ${body.session.status}.`;
          form.reset();
        } catch (error) {
          result.dataset.state = 'error';
          result.textContent = error.message || 'Could not connect to the API. Please try again.';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
