services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpcloud
      POSTGRES_USER: rpcloud
      POSTGRES_PASSWORD: rpcloud
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpcloud -d rpcloud"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://db:5432/rpcloud -user=rpcloud -password=rpcloud -connectRetries=10 migrate
    volumes: ["./db/migration:/flyway/sql:ro"]
    depends_on:
      db: { condition: service_healthy }

  app:
    build: ./app
    ports: ["3000:3000"]
    depends_on:
      flyway: { condition: service_completed_successfully }
